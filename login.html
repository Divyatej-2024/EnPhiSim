<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mock Gmail</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f1f3f4;
    }

    /* Top bar */
    .top-bar {
      display: flex;
      align-items: center;
      background-color: #ffffff;
      padding: 10px 20px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }

    .top-bar h1 {
      font-size: 20px;
      color: #202124;
      margin: 0;
      flex-grow: 1;
    }

    .top-bar input {
      padding: 5px 10px;
      border-radius: 20px;
      border: 1px solid #dcdcdc;
      width: 300px;
    }

    /* Main container */
    .container {
      display: flex;
      height: calc(100vh - 50px);
    }

    /* Sidebar */
    .sidebar {
      width: 220px;
      background-color: #ffffff;
      padding: 20px;
      box-shadow: 1px 0 2px rgba(0,0,0,0.1);
    }

    .sidebar button {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border: none;
      border-radius: 4px;
      background-color: #1a73e8;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .sidebar ul {
      list-style: none;
      padding: 0;
      margin-top: 20px;
    }

    .sidebar ul li {
      padding: 10px 5px;
      cursor: pointer;
      border-radius: 4px;
    }

    .sidebar ul li:hover {
      background-color: #e8f0fe;
    }

    /* Inbox list */
    .inbox {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .email-list {
      flex: 1;
      overflow-y: auto;
      background-color: #f1f3f4;
    }

    .email-item {
      background-color: white;
      padding: 15px 20px;
      border-bottom: 1px solid #e0e0e0;
      display: flex;
      justify-content: space-between;
      cursor: pointer;
    }

    .email-item:hover {
      background-color: #f1f3f4;
    }

    .email-preview {
      flex: 1;
      padding: 20px;
      background-color: white;
      border-left: 1px solid #e0e0e0;
      overflow-y: auto;
    }

    .email-header {
      font-weight: bold;
      margin-bottom: 10px;
    }

    .email-content {
      line-height: 1.6;
    }

    .split {
      display: flex;
      height: 100%;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <h1>Gmail</h1>
    <input type="text" placeholder="Search mail">
  </div>

  <div class="container">
    <div class="sidebar">
      <button>Compose</button>
      <ul>
        <li>Inbox</li>
        <li>Starred</li>
        <li>Sent</li>
        <li>Drafts</li>
        <li>Trash</li>
      </ul>
    </div>

    <div class="inbox">
      <div class="split">
        <div class="email-list">
          <div class="email-item">
            <span>John Doe</span>
            <span>Meeting at 3 PM</span>
          </div>
          <div class="email-item">
            <span>Amazon</span>
            <span>Your order has shipped</span>
          </div>
          <div class="email-item">
            <span>LinkedIn</span>
            <span>New connection request</span>
          </div>
        </div>

        <div class="email-preview">
          <div class="email-header">John Doe - Meeting at 3 PM</div>
          <div class="email-content">
            Hi, <br><br>
            Just confirming our meeting at 3 PM today. Please let me know if you need to reschedule. <br><br>
            Thanks,<br>
            John
          </div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
