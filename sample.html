<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ENPHISIM Browser</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0d1117;
      color: #e6edf3;
    }

    /* Fake browser frame */
    .browser {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #161b22;
      border-radius: 4px;
    }

    /* Top bar */
    .browser-top {
      display: flex;
      align-items: center;
      padding: 8px 12px;
      gap: 8px;
      background: #0d1117;
      border-bottom: 1px solid #21262d;
    }

    /* Fake buttons */
    .btns {
      display: flex;
      gap: 6px;
    }

    .circle {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
    .red { background: #ff5f57; }
    .yellow { background: #ffbd2e; }
    .green { background: #28c840; }

    /* URL bar */
    .url-bar {
      flex: 1;
      background: #21262d;
      padding: 6px 10px;
      border-radius: 4px;
      color: #8b949e;
      font-size: 14px;
      overflow: hidden;
      white-space: nowrap;
    }

    .secure {
      color: #3fb950;
      margin-right: 6px;
    }

    /* Tab area */
    .tabs {
      display: flex;
      gap: 4px;
      margin-left: 10px;
    }

    .tab {
      padding: 6px 12px;
      background: #21262d;
      border-radius: 4px;
      font-size: 13px;
      color: #c9d1d9;
    }

    .tab.active {
      background: #2d333b;
      border-bottom: 2px solid #2382f1;
      color: #ffffff;
    }

    /* Main content */
    .content {
      flex: 1;
      background: #0d1117;
      padding: 20px;
      overflow-y: auto;
    }

    .content-card {
      background: #161b22;
      border: 1px solid #21262d;
      padding: 20px;
      border-radius: 6px;
    }
  </style>
</head>

<body>
  <div class="browser">

    <!-- Top Browser Bar -->
    <div class="browser-top">
      <div class="btns">
        <div class="circle red"></div>
        <div class="circle yellow"></div>
        <div class="circle green"></div>
      </div>

      <!-- Tabs -->
      <div class="tabs">
        <div class="tab active">ENPHISIM · Mail</div>
        <div class="tab">Dashboard</div>
        <div class="tab">User Report</div>
      </div>

      <!-- URL Bar -->
      <div class="url-bar">
        <span class="secure">🔒</span>
        https://mail.enphisim.com/inbox
      </div>
    </div>

    <!-- Page Content Container -->
    <div class="content">
      <div class="content-card">
        <!-- Insert email UI, level content, phishing template etc. here -->
        <h2>ENPHISIM Mail Viewer</h2>
        <p>This is a placeholder. Replace with your phishing email layout.</p>

        <p>Example:</p>
        <ul>
          <li>Sender: it-supp0rt@enphisim.com</li>
          <li>Subject: Reset Your Password Urgently</li>
          <li>Attachments, buttons, CTA analysis</li>
        </ul>
      </div>
    </div>
  </div>
</body>
</html>
