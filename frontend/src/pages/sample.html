<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Email Level</title>
</head>
<body style="background:#f4f4f4; padding:40px; font-family: Arial, sans-serif;">

  <div
    style="
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    "
  >

    <!-- HEADER -->
    <div
      style="
        display: flex;
        justify-content: space-between;
        margin-bottom: 20px;
      "
    >
      <div>
        <strong
          style="
            display: block;
            font-size: 18px;
            color: #222;
          "
        >
          IT Support
        </strong>

        <span
          style="
            font-size: 14px;
            color: gray;
          "
        >
          it-support@university.ac.uk
        </span>
      </div>

      <div
        style="
          font-size: 14px;
          color: #555;
        "
      >
        Today
      </div>
    </div>

    <!-- SUBJECT -->
    <div
      style="
        font-size: 20px;
        font-weight: bold;
        margin-bottom: 15px;
      "
    >
      Phishing Email Basics
    </div>

    <!-- EMAIL BODY -->
    <div
      style="
        font-size: 16px;
        line-height: 1.6;
        margin-bottom: 25px;
      "
    >
      <p>You’ve received an email claiming to be from your IT admin. It asks you to verify your login immediately.</p>
      <p>Should you trust this?</p>
    </div>

    <!-- OPTIONS -->
    <div
      style="
        display: flex;
        flex-direction: column;
        gap: 12px;
      "
    >
      <button
        style="
          padding: 12px 20px;
          background: #1a73e8;
          color: white;
          border: none;
          border-radius: 6px;
          cursor: pointer;
          font-size: 16px;
          transition: 0.2s;
        "
        onmouseover="this.style.background='#155ec4'"
        onmouseout="this.style.background='#1a73e8'"
      >
        Verify Now
      </button>

      <button
        style="
          padding: 12px 20px;
          background: #1a73e8;
          color: white;
          border: none;
          border-radius: 6px;
          cursor: pointer;
          font-size: 16px;
          transition: 0.2s;
        "
        onmouseover="this.style.background='#155ec4'"
        onmouseout="this.style.background='#1a73e8'"
      >
        Report Phishing
      </button>

      <button
        style="
          padding: 12px 20px;
          background: #1a73e8;
          color: white;
          border: none;
          border-radius: 6px;
          cursor: pointer;
          font-size: 16px;
          transition: 0.2s;
        "
        onmouseover="this.style.background='#155ec4'"
        onmouseout="this.style.background='#1a73e8'"
      >
        Ignore
      </button>
    </div>
  </div>

</body>
</html>
